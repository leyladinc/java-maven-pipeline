name: Build and Deploy WAR to Apache Tomcat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR package
        run: |
          mvn clean package -DskipTests

      - name: Verify WAR file location
        run: |
          echo "Listing WAR files:"
          find . -name "*.war" || echo "No WAR files found!"

      - name: Build Docker image
        run: docker build -t java-maven-pipeline . 
      - name: Run container and test
        run: |
          docker run -d --name app -p 8080:8080 java-maven-pipeline
          for i in {1..10}; do
            if curl -fsS http://localhost:8080; then
              exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1

